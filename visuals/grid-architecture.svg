<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
 <title id="title">PyASPG smart-grid architecture</title><desc id="desc">Electricity flows from generators through transmission lines, substations and distribution to prosumers, while measurements flow through meters and aggregators to control.</desc>
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1220"/><stop offset="1" stop-color="#14263c"/></linearGradient><linearGradient id="card" x2="1"><stop stop-color="#14243a"/><stop offset="1" stop-color="#1b3450"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter></defs>
 <rect width="1100" height="330" rx="24" fill="url(#bg)"/><text x="38" y="43" fill="#69e0c2" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">PHYSICAL GRID + DATA PLANE</text><text x="38" y="75" fill="#edf5ff" font-family="Arial,sans-serif" font-size="26" font-weight="700">One model. Two flows. Connected impact.</text>
 <g font-family="Arial,sans-serif" filter="url(#shadow)">
  <g><rect x="35" y="122" width="150" height="76" rx="14" fill="url(#card)" stroke="#ffb86b"/><text x="110" y="153" text-anchor="middle" fill="#ffb86b" font-size="13" font-weight="700">GENERATION</text><text x="110" y="176" text-anchor="middle" fill="#edf5ff" font-size="12">plant · wind · solar</text></g>
  <g><rect x="240" y="122" width="150" height="76" rx="14" fill="url(#card)" stroke="#8ab4ff"/><text x="315" y="153" text-anchor="middle" fill="#8ab4ff" font-size="13" font-weight="700">TRANSMISSION</text><text x="315" y="176" text-anchor="middle" fill="#edf5ff" font-size="12">lines · losses</text></g>
  <g><rect x="445" y="122" width="150" height="76" rx="14" fill="url(#card)" stroke="#69e0c2"/><text x="520" y="153" text-anchor="middle" fill="#69e0c2" font-size="13" font-weight="700">SUBSTATIONS</text><text x="520" y="176" text-anchor="middle" fill="#edf5ff" font-size="12">dispatch · balance</text></g>
  <g><rect x="650" y="122" width="150" height="76" rx="14" fill="url(#card)" stroke="#69e0c2"/><text x="725" y="153" text-anchor="middle" fill="#69e0c2" font-size="13" font-weight="700">DISTRIBUTION</text><text x="725" y="176" text-anchor="middle" fill="#edf5ff" font-size="12">local network · storage</text></g>
  <g><rect x="855" y="122" width="200" height="76" rx="14" fill="url(#card)" stroke="#69e0c2"/><text x="955" y="153" text-anchor="middle" fill="#69e0c2" font-size="13" font-weight="700">PROSUMERS</text><text x="955" y="176" text-anchor="middle" fill="#edf5ff" font-size="12">demand · renewable power</text></g>
 </g>
 <g fill="none" stroke="#ffb86b" stroke-width="2.5"><path d="M185 160h45"/><path d="M390 160h45"/><path d="M595 160h45"/><path d="M800 160h45"/></g><g fill="#ffb86b"><path d="m230 154 10 6-10 6z"/><path d="m435 154 10 6-10 6z"/><path d="m640 154 10 6-10 6z"/><path d="m845 154 10 6-10 6z"/></g>
 <path d="M955 202v46H145v-44" fill="none" stroke="#8ab4ff" stroke-width="2" stroke-dasharray="6 6"/><path d="m140 207 5-10 5 10z" fill="#8ab4ff"/><rect x="321" y="229" width="458" height="44" rx="12" fill="#101d2e" stroke="#38516e"/><text x="550" y="247" fill="#8ab4ff" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700">SMART METER → AGGREGATOR → UTILITY → CONTROL</text><text x="550" y="264" fill="#91a6bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">FDIA targets reports; topology shapes system impact</text>
</svg>
